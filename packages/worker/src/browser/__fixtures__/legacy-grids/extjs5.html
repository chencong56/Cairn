<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>ExtJS 5.x grid（按官方默认 DOM 约定自建）</title></head>
<body>
<div id="gridpanel-1020" class="x-panel x-grid x-panel-default">
  <div class="x-panel-header"><div class="x-title-text">设备清单</div></div>
  <div class="x-grid-header-ct"><div class="x-grid-header-ct-inner">
    <div id="gridcolumn-1021" class="x-column-header x-column-header-checkbox"><div class="x-column-header-inner"><div class="x-column-header-text-inner"><div class="x-grid-row-checker">&nbsp;</div></div></div></div>
    <div id="gridcolumn-1022" class="x-column-header"><div class="x-column-header-inner"><div class="x-column-header-text-inner">名称</div></div></div>
    <div id="gridcolumn-1023" class="x-column-header"><div class="x-column-header-inner"><div class="x-column-header-text-inner">数量</div></div></div>
    <div id="gridcolumn-1024" class="x-column-header"><div class="x-column-header-inner"><div class="x-column-header-text-inner">金额</div></div></div>
  </div></div>
  <div id="gridview-1025" class="x-grid-view">
    <div id="ext-gen1050" class="x-grid-item-container">
      <table class="x-grid-item"><tbody><tr class="x-grid-row">
        <td class="x-grid-cell x-grid-cell-row-checker"><div class="x-grid-cell-inner"><div class="x-grid-row-checker">&nbsp;</div></div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">服务器A</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">12</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">1,234.50</div></td>
      </tr></tbody></table>
      <table class="x-grid-item"><tbody><tr class="x-grid-row">
        <td class="x-grid-cell x-grid-cell-row-checker"><div class="x-grid-cell-inner"><div class="x-grid-row-checker">&nbsp;</div></div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">服务器B</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">7</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">2,000.00</div></td>
      </tr></tbody></table>
      <table class="x-grid-item"><tbody><tr class="x-grid-row">
        <td class="x-grid-cell x-grid-cell-row-checker"><div class="x-grid-cell-inner"><div class="x-grid-row-checker">&nbsp;</div></div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">服务器C</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">11</div></td>
        <td class="x-grid-cell"><div class="x-grid-cell-inner">2,000.00</div></td>
      </tr></tbody></table>
    </div>
  </div>
</div>
</body>
</html>
