<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>排版用的外层表格 + 内层数据表</title></head>
<body>
<table id="layout" width="100%">
  <tr>
    <td width="200">左侧菜单</td>
    <td>
      <div class="box-title">待办事项</div>
      <table id="todo">
        <thead><tr><th>名称</th><th>状态</th></tr></thead>
        <tbody>
          <tr><td>预算审批</td><td>待办</td></tr>
          <tr><td>请假申请</td><td>已办</td></tr>
        </tbody>
      </table>
      <div class="box-title">告警列表</div>
      <table id="alarm">
        <thead><tr><th>名称</th><th>状态</th></tr></thead>
        <tbody>
          <tr><td>CPU 过高</td><td>未处理</td></tr>
          <tr><td>磁盘告警</td><td>已处理</td></tr>
        </tbody>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
