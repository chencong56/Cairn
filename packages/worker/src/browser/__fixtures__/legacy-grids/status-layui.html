<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>layui 状态信号（按 layui 2.x 默认 DOM 自建，数据为虚构）</title></head>
<body>
<h2>状态信号（layui）</h2>
<p id="tags"><span class="layui-badge layui-bg-green" data-expect-tone="success">在用</span> <span class="layui-badge layui-bg-blue" data-expect-tone="info">同步中</span> <span class="layui-badge layui-bg-orange" data-expect-tone="warning">待核查</span> <span class="layui-badge layui-bg-red" data-expect-tone="error">故障</span> <span class="layui-badge layui-bg-gray" data-expect-tone="default">停用</span> <span class="layui-badge" data-expect-tone="unknown">绿色标签</span> <span class="layui-badge" data-expect-tone="unknown">自定义色</span></p>
<div class="layui-form layui-border-box layui-table-view" id="status-grid"><div class="layui-table-box"><div class="layui-table-header"><table class="layui-table"><thead><tr><th data-field="id"><div class="layui-table-cell"><span>编号</span></div></th><th data-field="name"><div class="layui-table-cell"><span>站点名称</span></div></th><th data-field="status"><div class="layui-table-cell"><span>状态</span></div></th><th data-field="progress"><div class="layui-table-cell"><span>进度</span></div></th></tr></thead></table></div>
<div class="layui-table-body layui-table-main"><table class="layui-table"><tbody>
<tr data-index="1000"><td data-field="id"><div class="layui-table-cell">1000</div></td><td data-field="name"><div class="layui-table-cell">站点0001</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-green" data-expect-tone="success">在用</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="100"><div class="layui-progress-bar layui-bg-green" lay-percent="100%" style="width: 100%"></div></div></div></td></tr>
<tr data-index="1001"><td data-field="id"><div class="layui-table-cell">1001</div></td><td data-field="name"><div class="layui-table-cell">站点0002</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-gray" data-expect-tone="default">停用</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="13"><div class="layui-progress-bar" lay-percent="13%" style="width: 13%"></div></div></div></td></tr>
<tr data-index="1002"><td data-field="id"><div class="layui-table-cell">1002</div></td><td data-field="name"><div class="layui-table-cell">站点0003</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-orange" data-expect-tone="warning">待核查</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="26"><div class="layui-progress-bar" lay-percent="26%" style="width: 26%"></div></div></div></td></tr>
<tr data-index="1003"><td data-field="id"><div class="layui-table-cell">1003</div></td><td data-field="name"><div class="layui-table-cell">站点0004</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-green" data-expect-tone="success">在用</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="39"><div class="layui-progress-bar" lay-percent="39%" style="width: 39%"></div></div></div></td></tr>
<tr data-index="1004"><td data-field="id"><div class="layui-table-cell">1004</div></td><td data-field="name"><div class="layui-table-cell">站点0005</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-gray" data-expect-tone="default">停用</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="52"><div class="layui-progress-bar" lay-percent="52%" style="width: 52%"></div></div></div></td></tr>
<tr data-index="1005"><td data-field="id"><div class="layui-table-cell">1005</div></td><td data-field="name"><div class="layui-table-cell">站点0006</div></td><td data-field="status"><div class="layui-table-cell"><span class="layui-badge layui-bg-orange" data-expect-tone="warning">待核查</span></div></td><td data-field="progress"><div class="layui-table-cell"><div class="layui-progress" data-expect-percent="65"><div class="layui-progress-bar" lay-percent="65%" style="width: 65%"></div></div></div></td></tr>
</tbody></table></div></div></div>
</body>
</html>
