<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>ExtJS 4.x grid（按官方默认 DOM 约定自建）</title></head>
<body>
<div id="gridpanel-1010" class="x-panel x-grid x-fit-item x-panel-default x-grid-with-row-lines">
  <div class="x-panel-header"><span class="x-title-text">设备清单</span></div>
  <div class="x-grid-header-ct"><div class="x-grid-header-ct-inner">
    <div id="gridcolumn-1011" class="x-column-header x-column-header-first"><div class="x-column-header-inner"><span class="x-column-header-text">名称</span></div></div>
    <div id="gridcolumn-1012" class="x-column-header"><div class="x-column-header-inner"><span class="x-column-header-text">数量</span></div></div>
    <div id="gridcolumn-1013" class="x-column-header"><div class="x-column-header-inner"><span class="x-column-header-text">金额</span></div></div>
    <div id="gridcolumn-1014" class="x-column-header" style="display:none"><div class="x-column-header-inner"><span class="x-column-header-text">内部码</span></div></div>
  </div></div>
  <div id="gridview-1015" class="x-grid-view x-fit-item x-grid-view-default">
    <table id="gridview-1015-record-1" class="x-grid-item x-grid-table"><tbody><tr class="x-grid-row">
      <td class="x-grid-cell x-grid-cell-gridcolumn-1011"><div class="x-grid-cell-inner">服务器A</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1012"><div class="x-grid-cell-inner">12</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1013"><div class="x-grid-cell-inner">1,234.50</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1014" style="display:none"><div class="x-grid-cell-inner">x1</div></td>
    </tr></tbody></table>
    <table id="gridview-1015-record-2" class="x-grid-item x-grid-table"><tbody><tr class="x-grid-row">
      <td class="x-grid-cell x-grid-cell-gridcolumn-1011"><div class="x-grid-cell-inner">服务器B</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1012"><div class="x-grid-cell-inner">7</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1013"><div class="x-grid-cell-inner">2,000.00</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1014" style="display:none"><div class="x-grid-cell-inner">x2</div></td>
    </tr></tbody></table>
    <table id="gridview-1015-record-3" class="x-grid-item x-grid-table"><tbody><tr class="x-grid-row">
      <td class="x-grid-cell x-grid-cell-gridcolumn-1011"><div class="x-grid-cell-inner">服务器C</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1012"><div class="x-grid-cell-inner">11</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1013"><div class="x-grid-cell-inner">2,000.00</div></td>
      <td class="x-grid-cell x-grid-cell-gridcolumn-1014" style="display:none"><div class="x-grid-cell-inner">x3</div></td>
    </tr></tbody></table>
  </div>
  <div class="x-toolbar x-docked x-toolbar-docked-bottom x-paging-toolbar">共 3 条</div>
</div>
</body>
</html>
