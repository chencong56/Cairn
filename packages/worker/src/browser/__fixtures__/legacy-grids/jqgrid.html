<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>jqGrid（按官方默认 DOM 约定自建）</title></head>
<body>
<div id="gbox_grid" class="ui-jqgrid">
  <div id="gview_grid" class="ui-jqgrid-view">
    <div class="ui-jqgrid-titlebar"><span class="ui-jqgrid-title">设备清单</span></div>
    <div class="ui-jqgrid-hdiv"><div class="ui-jqgrid-hbox">
      <table class="ui-jqgrid-htable"><thead>
        <tr class="ui-jqgrid-labels">
          <th id="grid_cb"><input type="checkbox" class="cbox"></th>
          <th id="grid_rn"><div class="ui-jqgrid-sortable"></div></th>
          <th id="grid_name"><div class="ui-jqgrid-sortable">名称</div></th>
          <th id="grid_qty"><div class="ui-jqgrid-sortable">数量</div></th>
          <th id="grid_amount"><div class="ui-jqgrid-sortable">金额</div></th>
          <th id="grid_expire"><div class="ui-jqgrid-sortable">到期日</div></th>
          <th id="grid_hid" style="display:none"><div class="ui-jqgrid-sortable">内部码</div></th>
        </tr>
      </thead></table>
    </div></div>
    <div class="ui-jqgrid-bdiv"><table id="grid" class="ui-jqgrid-btable"><tbody>
      <tr class="jqgfirstrow" style="height:auto"><td style="height:0"></td><td style="height:0"></td><td style="height:0"></td><td style="height:0"></td><td style="height:0"></td><td style="height:0"></td><td style="height:0;display:none"></td></tr>
      <tr class="jqgroup ui-row-ltr"><td colspan="7">机房一</td></tr>
      <tr id="1" class="ui-widget-content jqgrow ui-row-ltr"><td aria-describedby="grid_cb"><input type="checkbox" class="cbox"></td><td aria-describedby="grid_rn">1</td><td aria-describedby="grid_name">服务器A</td><td aria-describedby="grid_qty">12</td><td aria-describedby="grid_amount">1,234.50</td><td aria-describedby="grid_expire">2026-12-31</td><td aria-describedby="grid_hid" style="display:none">x1</td></tr>
      <tr id="2" class="ui-widget-content jqgrow ui-row-ltr"><td aria-describedby="grid_cb"><input type="checkbox" class="cbox"></td><td aria-describedby="grid_rn">2</td><td aria-describedby="grid_name">服务器B</td><td aria-describedby="grid_qty">7</td><td aria-describedby="grid_amount">2,000.00</td><td aria-describedby="grid_expire">2027/01/15</td><td aria-describedby="grid_hid" style="display:none">x2</td></tr>
      <tr class="jqgroup ui-row-ltr"><td colspan="7">机房二</td></tr>
      <tr id="3" class="ui-widget-content jqgrow ui-row-ltr"><td aria-describedby="grid_cb"><input type="checkbox" class="cbox"></td><td aria-describedby="grid_rn">3</td><td aria-describedby="grid_name">服务器C</td><td aria-describedby="grid_qty">11</td><td aria-describedby="grid_amount">2,000.00</td><td aria-describedby="grid_expire">2026年11月05日</td><td aria-describedby="grid_hid" style="display:none">x3</td></tr>
    </tbody></table></div>
    <div class="ui-jqgrid-sdiv"><div class="ui-jqgrid-hbox"><table class="ui-jqgrid-ftable"><tbody>
      <tr class="footrow footrow-ltr"><td aria-describedby="grid_cb"></td><td aria-describedby="grid_rn"></td><td aria-describedby="grid_name">合计</td><td aria-describedby="grid_qty">30</td><td aria-describedby="grid_amount">5,234.50</td><td aria-describedby="grid_expire"></td><td aria-describedby="grid_hid" style="display:none"></td></tr>
    </tbody></table></div></div>
  </div>
  <div id="pager" class="ui-jqgrid-pager"><div class="ui-paging-info">1 - 3　共 3 条</div></div>
</div>
</body>
</html>
