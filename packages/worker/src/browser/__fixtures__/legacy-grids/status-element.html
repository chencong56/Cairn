<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Element UI 状态信号（按 Element UI 2.x 默认 DOM 自建，数据为虚构）</title></head>
<body>
<h2>状态信号（Element UI）</h2>
<div class="el-steps el-steps--horizontal" id="steps"><div class="el-step is-horizontal" data-expect-tone="success"><div class="el-step__head is-finish"><div class="el-step__line"></div><div class="el-step__icon is-text"></div></div><div class="el-step__main"><div class="el-step__title is-finish">提交申请</div></div></div><div class="el-step is-horizontal" data-expect-tone="success"><div class="el-step__head is-finish"><div class="el-step__line"></div><div class="el-step__icon is-text"></div></div><div class="el-step__main"><div class="el-step__title is-finish">部门审批</div></div></div><div class="el-step is-horizontal" data-expect-tone="processing"><div class="el-step__head is-process"><div class="el-step__line"></div><div class="el-step__icon is-text"></div></div><div class="el-step__main"><div class="el-step__title is-process">财务复核</div></div></div><div class="el-step is-horizontal" data-expect-tone="default"><div class="el-step__head is-wait"><div class="el-step__line"></div><div class="el-step__icon is-text"></div></div><div class="el-step__main"><div class="el-step__title is-wait">归档</div></div></div></div>
<p id="tags"><span class="el-tag el-tag--light el-tag--success" data-expect-tone="success">在用</span> <span class="el-tag el-tag--light" data-expect-tone="default">同步中</span> <span class="el-tag el-tag--light el-tag--warning" data-expect-tone="warning">待核查</span> <span class="el-tag el-tag--light el-tag--danger" data-expect-tone="error">故障</span> <span class="el-tag el-tag--light el-tag--info" data-expect-tone="info">停用</span> <span class="el-tag el-tag--light" data-expect-tone="default" style="background-color:#e0f5f5;color:#0aa">绿色标签</span> <span class="el-tag el-tag--light" data-expect-tone="default" style="background-color:#e0f5f5;color:#0aa">自定义色</span></p>
<div id="odd-progress"><div role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line is-custom" data-expect-tone="unknown" data-expect-percent="40"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 40%;"></div></div></div><div class="el-progress__text">40%</div></div></div>
<div class="el-table el-table--fit" id="status-grid"><div class="el-table__header-wrapper"><table class="el-table__header"><thead><tr><th class="el-table_1_column_1 is-leaf el-table__cell"><div class="cell">编号</div></th><th class="el-table_1_column_2 is-leaf el-table__cell"><div class="cell">站点名称</div></th><th class="el-table_1_column_3 is-leaf el-table__cell"><div class="cell">状态</div></th><th class="el-table_1_column_4 is-leaf el-table__cell"><div class="cell">进度</div></th></tr></thead></table></div>
<div class="el-table__body-wrapper"><table class="el-table__body"><tbody>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1000</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0001</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--success" data-expect-tone="success">在用</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line is-success" data-expect-percent="100"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 100%;"></div></div></div><div class="el-progress__text">100%</div></div></div></td></tr>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1001</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0002</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--info" data-expect-tone="info">停用</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="13" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line" data-expect-percent="13"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 13%;"></div></div></div><div class="el-progress__text">13%</div></div></div></td></tr>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1002</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0003</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--warning" data-expect-tone="warning">待核查</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="26" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line" data-expect-percent="26"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 26%;"></div></div></div><div class="el-progress__text">26%</div></div></div></td></tr>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1003</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0004</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--success" data-expect-tone="success">在用</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="39" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line" data-expect-percent="39"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 39%;"></div></div></div><div class="el-progress__text">39%</div></div></div></td></tr>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1004</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0005</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--info" data-expect-tone="info">停用</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="52" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line" data-expect-percent="52"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 52%;"></div></div></div><div class="el-progress__text">52%</div></div></div></td></tr>
<tr class="el-table__row"><td class="el-table_1_column_1 el-table__cell"><div class="cell">1005</div></td><td class="el-table_1_column_2 el-table__cell"><div class="cell">站点0006</div></td><td class="el-table_1_column_3 el-table__cell"><div class="cell"><span class="el-tag el-tag--light el-tag--warning" data-expect-tone="warning">待核查</span></div></td><td class="el-table_1_column_4 el-table__cell"><div class="cell"><div role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" class="el-progress el-progress--line" data-expect-percent="65"><div class="el-progress-bar"><div class="el-progress-bar__outer"><div class="el-progress-bar__inner" style="width: 65%;"></div></div></div><div class="el-progress__text">65%</div></div></div></td></tr>
</tbody></table></div></div>
</body>
</html>
