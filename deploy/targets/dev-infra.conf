# 远端专用开发组件。端口 / 绑定 / 桶只写在这里，compose 与 .env.remote 跟清单走。
# 与 cluster.conf 的容器名、端口零交集。
# 数据与配置在 gs1：/home/cairn/{pg,rustfs,compose.yml,.env}
# 本机：./deploy/cairn dev-infra up|status|down
name=dev-infra
remote_root=/home/cairn
build_host=gs1
bind=0.0.0.0
pg_port=25432
redis_port=26380
s3_port=19031
s3_console_port=19032
bucket=cairn-dev-evidence

[host.gs1]
ssh=root@shsnc-gs1
lan_ip=10.0.0.2
reach=100.64.0.8
role=dev-infra
compose=compose.yml
restart=cairn-dev-pg cairn-dev-redis cairn-dev-rustfs cairn-dev-bucket-init
