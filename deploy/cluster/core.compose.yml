# Cairn 集群核心栈（仅在 ah3 / 192.168.3.203 运行）
# 应用产物不打进镜像：cairn-api / cairn-worker 镜像仅作运行时底座（Node24+Chromium+字体+原生库），
# /app 由宿主目录 /data/wp/cairn/cluster/apps/<name> 挂载提供（dist + 生产 node_modules），更新=同步产物+restart。
# 存量容器（snclog*、旧 cairn-postgres/cairn-rustfs）与本项目零交集。
# 用法：cd /data/wp/cairn/cluster/deploy && docker compose -f core.compose.yml up -d
name: cairn-cluster

networks:
  cairn-net:
    name: cairn-net

x-worker-base: &worker-base
  # 运行时底座镜像（含 Chromium/CJK 字体/原生库），应用代码挂载覆盖
  image: cairn-worker:${CAIRN_RUNTIME_TAG}
  restart: unless-stopped
  working_dir: /app
  env_file: .env
  depends_on:
    cairn-migrate:
      condition: service_completed_successfully
  networks:
    - cairn-net

services:
  # ── 基础设施 ──
  cairn-pg:
    image: postgres:16
    container_name: cairn-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CAIRN_DB_USER}
      POSTGRES_PASSWORD: ${CAIRN_DB_PASSWORD}
      POSTGRES_DB: ${CAIRN_DB_NAME}
      TZ: Asia/Shanghai
    ports:
      - "${HOST_IP}:15432:5432"
    volumes:
      - ../pg/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cairn-net

  cairn-redis:
    image: redis:7-alpine
    container_name: cairn-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${HOST_IP}:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - cairn-net

  cairn-rustfs2:
    # 固定 digest（1.0.0-rc.5，与 ah3 存量实例同源已验证）
    image: rustfs/rustfs@sha256:b7014e0ce2bc703c1316b3ef760e29dfae61fe4a50d1a66fa89638e0f8ea211f
    container_name: cairn-rustfs2
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${HOST_IP}:9031:9000"
      - "${HOST_IP}:9032:9001"
    volumes:
      - ../rustfs2:/data
    networks:
      - cairn-net

  cairn-bucket-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cairn-bucket-init
    restart: "no"
    depends_on:
      - cairn-rustfs2
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      CAIRN_S3_BUCKET: ${CAIRN_S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        i=0
        until mc alias set cairn http://cairn-rustfs2:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then echo "RustFS 60s 内未就绪" >&2; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "cairn/$$CAIRN_S3_BUCKET"
        mc anonymous set none "cairn/$$CAIRN_S3_BUCKET"
        echo "bucket ready: $$CAIRN_S3_BUCKET"
    networks:
      - cairn-net

  cairn-migrate:
    # 一次性迁移任务：全部 PG 迁移（含 cairn schema 创建），用挂载的应用产物执行
    image: cairn-api:${CAIRN_RUNTIME_TAG}
    container_name: cairn-migrate
    restart: "no"
    working_dir: /app
    env_file: .env
    command: ["node", "node_modules/@cairn/db/dist/bin/migrate-cli.js"]
    volumes:
      - ../apps/api:/app
    depends_on:
      cairn-pg:
        condition: service_healthy
    networks:
      - cairn-net

  # ── 控制面 ──
  cairn-api:
    image: cairn-api:${CAIRN_RUNTIME_TAG}
    container_name: cairn-api
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ../apps/api:/app
    depends_on:
      cairn-migrate:
        condition: service_completed_successfully
      cairn-pg:
        condition: service_healthy
    networks:
      - cairn-net

  cairn-nginx:
    image: nginx:1.27-alpine
    container_name: cairn-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/entry.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/web:/usr/share/nginx/html:ro
    depends_on:
      - cairn-api
    networks:
      - cairn-net

  # ── Worker：单例角色（scheduler / analyst / maintenance）──
  cairn-scheduler:
    <<: *worker-base
    container_name: cairn-scheduler
    volumes:
      - ../apps/worker:/app
    environment:
      CAIRN_WORKER_ID: prod-scheduler-ah3
      CAIRN_WORKER_ROLES: scheduler
      CAIRN_WORKER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_WORKER_INTERNAL_PORT: 8091
      CAIRN_WORKER_ADVERTISE_URL: http://${HOST_IP}:8093
    ports:
      - "${HOST_IP}:8093:8091"

  cairn-analyst:
    <<: *worker-base
    container_name: cairn-analyst
    volumes:
      - ../apps/worker:/app
    environment:
      CAIRN_WORKER_ID: prod-analyst-ah3
      CAIRN_WORKER_ROLES: analyst
      CAIRN_WORKER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_WORKER_INTERNAL_PORT: 8091
      CAIRN_WORKER_ADVERTISE_URL: http://${HOST_IP}:8094
    ports:
      - "${HOST_IP}:8094:8091"

  cairn-maintenance:
    <<: *worker-base
    container_name: cairn-maintenance
    volumes:
      - ../apps/worker:/app
    environment:
      CAIRN_WORKER_ID: prod-maintenance-ah3
      CAIRN_WORKER_ROLES: maintenance
      CAIRN_WORKER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_WORKER_INTERNAL_PORT: 8091
      CAIRN_WORKER_ADVERTISE_URL: http://${HOST_IP}:8095
    ports:
      - "${HOST_IP}:8095:8091"

  # ── Worker：executor（ah3 本机实例）──
  cairn-executor-ah3:
    <<: *worker-base
    container_name: cairn-executor-ah3
    mem_limit: 6g
    volumes:
      - ../apps/worker:/app
      - ../browser-profiles:/data/cairn/browser-profiles
    environment:
      CAIRN_WORKER_ID: prod-executor-ah3
      CAIRN_WORKER_ROLES: executor
      CAIRN_WORKER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_WORKER_INTERNAL_PORT: 8091
      CAIRN_WORKER_ADVERTISE_URL: http://${HOST_IP}:8092
    ports:
      - "${HOST_IP}:8092:8091"
