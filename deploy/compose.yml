# 本机 PostgreSQL + RustFS（S3 对象存储）+ Redis。凭据与远端 shsnc-ah3 对齐，只改监听地址。
# 用法：在仓库根执行  pnpm infra:up
name: cairn

services:
  postgres:
    image: postgres:16
    container_name: cairn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CAIRN_DB_USER}
      POSTGRES_PASSWORD: ${CAIRN_DB_PASSWORD}
      POSTGRES_DB: ${CAIRN_DB_NAME}
    ports:
      - "127.0.0.1:${CAIRN_DB_PORT}:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAIRN_DB_USER} -d ${CAIRN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 测试专用 PostgreSQL：与开发库分开，数据放内存盘并关闭持久化保证（重启即清空，泄漏无法跨重启累积）。
  # 仅供 vitest 集成测试使用（packages/db/src/testing.ts 把 CAIRN_DB_PORT 锁定到 CAIRN_TEST_DB_PORT）。
  # 不指定 platform：跟随宿主架构，不得再在本机拉取其它架构镜像（见 docs/spec/2026-10-07-ai-dev-test-loop-and-isolation.md）。
  postgres-test:
    image: postgres:16
    container_name: cairn-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CAIRN_DB_USER}
      POSTGRES_PASSWORD: ${CAIRN_DB_PASSWORD}
      POSTGRES_DB: ${CAIRN_DB_NAME}
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=300
    shm_size: 256mb
    tmpfs:
      - /var/lib/postgresql/data:rw,size=4g
    ports:
      - "127.0.0.1:${CAIRN_TEST_DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAIRN_DB_USER} -d ${CAIRN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: cairn-rustfs
    restart: unless-stopped
    # 项目目录若在 macOS 共享挂载上，bind mount 会权限不足且 RustFS 不支持 FUSE，数据放命名卷。
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${CAIRN_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${CAIRN_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${CAIRN_S3_API_PORT:-9021}:9000"
      - "127.0.0.1:${CAIRN_S3_CONSOLE_PORT:-9022}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 建桶用 RustFS 镜像自带的 curl（SigV4），不依赖 mc 镜像（其 amd64 镜像在 arm64 上会崩）。桶已存在返回 200，幂等。
  rustfs-init:
    image: rustfs/rustfs:1.0.0
    container_name: cairn-rustfs-init
    user: "0:0"
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${CAIRN_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${CAIRN_S3_SECRET_KEY}
      S3_REGION: ${CAIRN_S3_REGION}
      CAIRN_S3_BUCKET: ${CAIRN_S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 "aws:amz:$$S3_REGION:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" \
          "http://rustfs:9000/$$CAIRN_S3_BUCKET")
        if [ "$$code" != "200" ]; then
          echo "建桶失败 HTTP $$code" >&2
          exit 1
        fi
        echo "bucket ready: $$CAIRN_S3_BUCKET"

  redis:
    image: redis:7-alpine
    container_name: cairn-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${CAIRN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  # 显式 name：沿用已有同名卷，不随 compose 项目名变化。
  rustfs-data:
    name: cairn-rustfs-data
  rustfs-logs:
    name: cairn-rustfs-logs
